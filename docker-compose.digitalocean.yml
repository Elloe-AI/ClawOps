# Digital Ocean Production Docker Compose
# Includes Nginx reverse proxy for SSL/HTTPS
# Uses pre-built images from Docker Hub

name: clawops-production

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - frontend
      - app-server
      - clawops-engine
    restart: unless-stopped
    networks:
      - clawops-network

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./clawops_engine/postgres-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - clawops-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "127.0.0.1:8123:8123"  # Only accessible from localhost
    volumes:
      - clickhouse-data:/var/lib/clickhouse/
      - clickhouse-logs:/var/log/clickhouse-server/
      - ./clickhouse-profiles-config.xml:/etc/clickhouse-server/users.d/lmnr.xml
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    networks:
      - clawops-network

  quickwit:
    image: quickwit/quickwit:v0.8.2
    ports:
      - "127.0.0.1:7280:7280"  # Only accessible from localhost
      - "127.0.0.1:7281:7281"
    environment:
      QW_DATA_DIR: /quickwit/qwdata
    command: ["run"]
    volumes:
      - quickwit-data:/quickwit/qwdata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7280/health/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - clawops-network

  query-engine:
    image: ${DOCKER_HUB_ORG:-clawops}/query-engine:${IMAGE_TAG:-latest}
    environment:
      PORT: 8903
    healthcheck:
      test: ["CMD", "sleep", "5"]
      interval: 10s
      timeout: 6s
      retries: 3
    restart: unless-stopped
    networks:
      - clawops-network

  app-server:
    image: ${DOCKER_HUB_ORG:-clawops}/app-server:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      query-engine:
        condition: service_healthy
      quickwit:
        condition: service_healthy
    environment:
      PORT: 8000
      GRPC_PORT: 8001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SHARED_SECRET_TOKEN: ${SHARED_SECRET_TOKEN}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD}
      ENVIRONMENT: FULL
      AEAD_SECRET_KEY: ${AEAD_SECRET_KEY}
      QUERY_ENGINE_URL: http://query-engine:8903
      QUICKWIT_SEARCH_URL: http://quickwit:7280
      QUICKWIT_INGEST_URL: http://quickwit:7281
      QUICKWIT_SPANS_INDEX_ID: spans
    restart: unless-stopped
    networks:
      - clawops-network

  clawops-engine:
    image: ${DOCKER_HUB_ORG:-clawops}/clawops-engine:${IMAGE_TAG:-latest}
    container_name: clawops-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${CLAWOPS_ENGINE_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LMNR_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
      INFECTION_MODEL: ${INFECTION_MODEL}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL}
      GUARD_MODEL: ${GUARD_MODEL}
      GUARD_DEVICE: ${GUARD_DEVICE:-cpu}
      HF_TOKEN: ${HF_TOKEN}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
      CLAWOPS_ENGINE_API_KEY: ${CLAWOPS_ENGINE_API_KEY}
      RUNNING_IN_DOCKER: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - clawops-network

  frontend:
    image: ${DOCKER_HUB_ORG:-clawops}/frontend:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - RUNNING_IN_DOCKER=1
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
      - QUICKWIT_SEARCH_URL=http://quickwit:7280
      - QUICKWIT_INGEST_URL=http://quickwit:7281
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CLAWOPS_ENGINE_URL=http://clawops-engine:8006
      - CLAWOPS_ENGINE_API_KEY=${CLAWOPS_ENGINE_API_KEY}
      - CLAWOPS_ADMIN_EMAILS=${CLAWOPS_ADMIN_EMAILS}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BACKEND_URL=http://app-server:8000
      - BACKEND_RT_URL=http://app-server:8002
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      quickwit:
        condition: service_healthy
      app-server:
        condition: service_started
      clawops-engine:
        condition: service_started
    restart: unless-stopped
    networks:
      - clawops-network

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  quickwit-data:
  nginx-cache:

networks:
  clawops-network:
    driver: bridge
